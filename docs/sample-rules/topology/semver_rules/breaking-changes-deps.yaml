- ruleID: semver-manifest-peerdependencies-react-dom-peer-dependency-range-changed
  labels:
  - source=semver-analyzer
  - change-type=manifest
  - manifest-field=peerDependencies.react-dom
  - has-codemod=true
  effort: 3
  category: mandatory
  description: Peer dependency `react-dom` range changed from `^17 || ^18` to `^17 || ^18 || ^19`
  message: |-
    Peer dependency change (peer-dependency-range-changed): Peer dependency `react-dom` range changed from `^17 || ^18` to `^17 || ^18 || ^19`

    Package `@patternfly/react-topology` changed peer dependency `react-dom`.
    Before: ^17 || ^18
    After: ^17 || ^18 || ^19
  when:
    frontend.dependency:
      name: '@patternfly/react-topology'
      lowerbound: 0.0.0
- ruleID: semver-manifest-peerdependencies-react-peer-dependency-range-changed
  labels:
  - source=semver-analyzer
  - change-type=manifest
  - manifest-field=peerDependencies.react
  - has-codemod=true
  effort: 3
  category: mandatory
  description: Peer dependency `react` range changed from `^17 || ^18` to `^17 || ^18 || ^19`
  message: |-
    Peer dependency change (peer-dependency-range-changed): Peer dependency `react` range changed from `^17 || ^18` to `^17 || ^18 || ^19`

    Package `@patternfly/react-topology` changed peer dependency `react`.
    Before: ^17 || ^18
    After: ^17 || ^18 || ^19
  when:
    frontend.dependency:
      name: '@patternfly/react-topology'
      lowerbound: 0.0.0
- ruleID: semver-dep-update-patternfly-react-topology
  labels:
  - change-type=dependency-update
  - has-codemod=true
  - source=semver-analyzer
  effort: 1
  category: mandatory
  description: Update @patternfly/react-topology to v6.1.0-prerelease.2
  message: |-
    Update @patternfly/react-topology from current version to ^6.1.0-prerelease.2. This package has breaking changes between v5.4.1 and v6.4.0.

    After updating package.json, regenerate your lockfile:
    - npm: npm install
    - yarn: yarn install
    - pnpm: pnpm install
  when:
    frontend.dependency:
      name: '@patternfly/react-topology'
      upperbound: 0.99.99
