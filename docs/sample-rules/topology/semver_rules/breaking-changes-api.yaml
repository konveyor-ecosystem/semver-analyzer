- ruleID: sd-test-contextsubmenuitem-role-presentation-div-removed
  labels:
  - source=semver-analyzer
  - change-type=test-impact
  - impact=frontend-testing
  - package=@patternfly/module
  effort: 1
  category: optional
  description: 'Test impact: ContextSubMenuItem role ''presentation'' removed'
  message: |-
    ContextSubMenuItem no longer has role='presentation'.

    Tests using getByRole('presentation') to find this component will fail.

    role='presentation' removed from <div> in ContextSubMenuItem
  when:
    frontend.referenced:
      pattern: (^|\.)(getByRole|queryByRole|findByRole|getAllByRole|queryAllByRole|findAllByRole)$
      location: FUNCTION_CALL
      value: ^presentation$
      filePattern: .*\.(test|spec)\.(ts|tsx|js|jsx)$
