  - source=semver-analyzer
  effort: 1
  category: mandatory
  description: Update react-test-renderer to v18.3.1
  message: |-
    Update react-test-renderer from current version to ^18.3.1. This package has breaking changes between v17.0.2 and v18.3.1.

    After updating package.json, regenerate your lockfile:
