- ruleID: semver-dep-update-patternfly-react-component-groups
  labels:
  - change-type=dependency-update
  - has-codemod=true
  - source=semver-analyzer
  effort: 1
  category: mandatory
  description: Update @patternfly/react-component-groups to v5.0.0-prerelease.0
  message: |-
    Update @patternfly/react-component-groups from current version to ^5.0.0-prerelease.0. This package has breaking changes between v5.5.3 and v6.4.0.

    After updating package.json, regenerate your lockfile:
    - npm: npm install
    - yarn: yarn install
    - pnpm: pnpm install
  when:
    frontend.dependency:
      name: '@patternfly/react-component-groups'
      upperbound: 5.99.99
