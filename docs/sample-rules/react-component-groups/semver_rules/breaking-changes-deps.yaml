- ruleID: semver-manifest-peerdependencies-patternfly-react-drag-drop-peer-dependency-added
  labels:
  - source=semver-analyzer
  - change-type=manifest
  - manifest-field=peerDependencies.@patternfly/react-drag-drop
  - has-codemod=true
  effort: 3
  category: mandatory
  description: Peer dependency `@patternfly/react-drag-drop@^6.0.0` was added. Consumers must install it.
  message: |-
    Peer dependency change (peer-dependency-added): Peer dependency `@patternfly/react-drag-drop@^6.0.0` was added. Consumers must install it.

    Package `@patternfly/react-component-groups` added peer dependency `@patternfly/react-drag-drop`.
    Before: (none)
    After: ^6.0.0
  when:
    frontend.dependency:
      name: '@patternfly/react-component-groups'
      lowerbound: 0.0.0
