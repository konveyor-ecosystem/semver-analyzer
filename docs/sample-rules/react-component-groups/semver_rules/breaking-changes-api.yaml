- ruleID: sd-new-absorbing-prop-warningmodal-confirmationinputlabel
  labels:
  - source=semver-analyzer
  - change-type=new-absorbing-prop
  - package=@patternfly/module
  effort: 3
  category: potential
  description: New `confirmationInputLabel` prop on <WarningModal> may absorb children content
  message: |-
    Component <WarningModal> has a new prop `confirmationInputLabel` (type: `React.ReactNode`) added in v6 that accepts JSX content.

    This prop may be intended to receive content that was previously passed as children. Review the JSX children of <WarningModal> and determine if any should be moved to the `confirmationInputLabel` prop.

    Example migration:
      Before: <WarningModal>{content} other children</WarningModal>
      After:  <WarningModal confirmationInputLabel={{content}}>other children</WarningModal>
  when:
    frontend.referenced:
      pattern: ^WarningModal$
      location: JSX_COMPONENT
      from: '@patternfly/module'
