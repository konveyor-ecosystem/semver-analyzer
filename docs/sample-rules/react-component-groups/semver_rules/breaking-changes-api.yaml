- ruleID: sd-test-ansible-attr-conditionality-data-ouia-component-id-i
  labels:
  - source=semver-analyzer
  - change-type=test-impact
  - change-type=attribute-conditionality
  - impact=frontend-testing
  - package=@patternfly/module
  effort: 1
  category: optional
  description: 'Test impact: Ansible `data-ouia-component-id` now conditionally rendered'
  message: |-
    Ansible no longer always renders `data-ouia-component-id` on `<i>`.

    Previously, `getAttribute('data-ouia-component-id')` returned a string value (e.g., `"false"`) even when the attribute was semantically "off". Now the attribute is omitted entirely when not active, so `getAttribute('data-ouia-component-id')` returns `null`.

    Update test assertions:
      `.getAttribute('data-ouia-component-id').toBe('false')` → `.not.toHaveAttribute('data-ouia-component-id')`
      or: `.getAttribute('data-ouia-component-id').toBeNull()`
      or: `expect(element).not.toHaveAttribute('data-ouia-component-id')`
  when:
    builtin.filecontent:
      pattern: (getAttribute|toHaveAttribute|\.not\.toHaveAttribute)\(\s*['"]data-ouia-component-id['"]\s*[,)]
      filePattern: .*\.(test|spec)\.(ts|tsx|js|jsx)$
