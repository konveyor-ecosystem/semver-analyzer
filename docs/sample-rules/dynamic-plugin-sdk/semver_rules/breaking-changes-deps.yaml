  - source=semver-analyzer
  effort: 1
  category: mandatory
  description: Update @openshift/dynamic-plugin-sdk to v5.0.1
  message: |-
    Update @openshift/dynamic-plugin-sdk from current version to ^5.0.1. This package has breaking changes between 097b4c9db08e1d1be28619f350b5e124abd85a40 and c362b0ab4cf0e8e0ddd1bc0c72b49637306f1e13.

    After updating package.json, regenerate your lockfile:
