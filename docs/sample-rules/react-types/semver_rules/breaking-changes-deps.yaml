- ruleID: semver-manifest-peerdependencies-types-react-peer-dependency-range-changed
  labels:
  - source=semver-analyzer
  - change-type=manifest
  - manifest-field=peerDependencies.@types/react
  - has-codemod=true
  effort: 3
  category: mandatory
  description: Peer dependency `@types/react` range changed from `^17.0.0` to `^18.0.0`
  message: |-
    Peer dependency change (peer-dependency-range-changed): Peer dependency `@types/react` range changed from `^17.0.0` to `^18.0.0`

    Package `@types/react-dom` changed peer dependency `@types/react`.
    Before: ^17.0.0
    After: ^18.0.0
  when:
    frontend.dependency:
      name: '@types/react-dom'
      lowerbound: 0.0.0
- ruleID: semver-dep-update-types-react-dom
  labels:
  - change-type=dependency-update
  - has-codemod=true
  - source=semver-analyzer
  effort: 1
  category: mandatory
  description: Update @types/react-dom to v18.3.0
  message: |-
    Update @types/react-dom from current version to ^18.3.0. This package has breaking changes between v17 and v18.

    After updating package.json, regenerate your lockfile:
    - npm: npm install
    - yarn: yarn install
    - pnpm: pnpm install
  when:
    frontend.dependency:
      name: '@types/react-dom'
      upperbound: 17.99.99
- ruleID: semver-dep-update-types-react
  labels:
  - change-type=dependency-update
  - has-codemod=true
  - source=semver-analyzer
  effort: 1
  category: mandatory
  description: Update @types/react to v18.3.0
  message: |-
    Update @types/react from current version to ^18.3.0. This package has breaking changes between v17 and v18.

    After updating package.json, regenerate your lockfile:
    - npm: npm install
    - yarn: yarn install
    - pnpm: pnpm install
  when:
    frontend.dependency:
      name: '@types/react'
      upperbound: 17.99.99
