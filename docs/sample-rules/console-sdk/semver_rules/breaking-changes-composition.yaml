  - package=@patternfly/metal3-plugin
  - family=baremetal-hosts
  effort: 1
  category: mandatory
  description: <EventsCard> must be a child of BareMetalHostDashboard
  message: |-
    <EventsCard> must be used inside <BareMetalHostDashboard>.

