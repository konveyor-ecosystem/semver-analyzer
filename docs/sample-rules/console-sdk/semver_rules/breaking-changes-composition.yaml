- ruleID: sd-context-nodelogs-themecontext
  labels:
  - source=semver-analyzer
  - change-type=context-dependency
  - package=@patternfly/console-app
  - component=NodeLogs
  effort: 3
  category: mandatory
  description: NodeLogs now requires ThemeContext context provider. Rendering without this provider may cause runtime errors or incorrect behavior.
  message: |-
    NodeLogs now requires ThemeContext context provider. Rendering without this provider may cause runtime errors or incorrect behavior.

    If you import and use ThemeContext directly, review your usage.
    The context shape or provider location may have changed.
  when:
    frontend.referenced:
      pattern: ^ThemeContext$
      location: IMPORT
      from: '@patternfly/console-app'
