- ruleID: sd-test-gettingstartedexpandablegrid-attr-conditionality-aria-label-span
  labels:
  - source=semver-analyzer
  - change-type=test-impact
  - change-type=attribute-conditionality
  - impact=frontend-testing
  - package=@patternfly/console-shared
  effort: 1
  category: optional
  description: 'Test impact: GettingStartedExpandableGrid `aria-label` now conditionally rendered'
  message: |-
    GettingStartedExpandableGrid no longer always renders `aria-label` on `<span>`.

    Previously, `getAttribute('aria-label')` returned a string value (e.g., `"false"`) even when the attribute was semantically "off". Now the attribute is omitted entirely when not active, so `getAttribute('aria-label')` returns `null`.

    Update test assertions:
      `.getAttribute('aria-label').toBe('false')` → `.not.toHaveAttribute('aria-label')`
      or: `.getAttribute('aria-label').toBeNull()`
      or: `expect(element).not.toHaveAttribute('aria-label')`
  when:
    builtin.filecontent:
      pattern: (getAttribute|toHaveAttribute|\.not\.toHaveAttribute)\(\s*['"]aria-label['"]\s*[,)]
      filePattern: .*\.(test|spec)\.(ts|tsx|js|jsx)$
