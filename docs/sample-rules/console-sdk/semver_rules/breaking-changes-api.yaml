- ruleID: sd-new-absorbing-prop-gettingstartedexpandablegrid-footercontent
  labels:
  - source=semver-analyzer
  - change-type=new-absorbing-prop
  - package=@patternfly/console-shared
  effort: 3
  category: potential
  description: New `footerContent` prop on <GettingStartedExpandableGrid> may absorb children content
  message: |-
    Component <GettingStartedExpandableGrid> has a new prop `footerContent` (type: `React.ReactNode`) added in v6 that accepts JSX content.

    This prop may be intended to receive content that was previously passed as children. Review the JSX children of <GettingStartedExpandableGrid> and determine if any should be moved to the `footerContent` prop.

    Example migration:
      Before: <GettingStartedExpandableGrid>{content} other children</GettingStartedExpandableGrid>
      After:  <GettingStartedExpandableGrid footerContent={{content}}>other children</GettingStartedExpandableGrid>
  when:
    frontend.referenced:
      pattern: ^GettingStartedExpandableGrid$
      location: JSX_COMPONENT
      from: '@patternfly/console-shared'
