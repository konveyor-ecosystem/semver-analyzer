    Previously, `getAttribute('role')` returned a string value (e.g., `"false"`) even when the attribute was semantically "off". Now the attribute is omitted entirely when not active, so `getAttribute('role')` returns `null`.

    Update test assertions:
      `.getAttribute('role').toBe('false')` → `.not.toHaveAttribute('role')`
      or: `.getAttribute('role').toBeNull()`
      or: `expect(element).not.toHaveAttribute('role')`
  when:
    builtin.filecontent:
      pattern: (getAttribute|toHaveAttribute|\.not\.toHaveAttribute)\(\s*['"]role['"]\s*[,)]
      filePattern: .*\.(test|spec)\.(ts|tsx|js|jsx)$
